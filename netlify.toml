[build]
  publish = "projects"
  command = ""

# only the static site/ folders are public; block the full-stack code
[[redirects]]
  from = "/:project/src/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/:project/db/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/:project/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/:project/docker/*"
  to = "/404"
  status = 404
  force = true
