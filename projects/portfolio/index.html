<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meghana | Front-End Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-300">

    <nav class="fixed w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm z-50 p-4 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <span class="font-bold text-xl">Meghana</span>
            <div class="space-x-6">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 bg-slate-200 dark:bg-slate-700 rounded">Toggle Theme</button>
            </div>
        </div>
    </nav>

    <section id="home" class="h-screen flex items-center justify-center bg-cover bg-center" style="background-image: url('images/workspace.jpg')">
        <div class="text-center bg-white/70 dark:bg-slate-900/70 p-10 rounded-xl backdrop-blur-sm">
            <h1 class="text-5xl font-bold">I'm Meghana</h1>
            <p class="text-2xl mt-4">Front-End Web Developer from Bengaluru</p>
            <div class="mt-8 space-x-4">
                <a href="#projects" class="px-6 py-3 bg-blue-600 text-white rounded">See My Work</a>
                <a href="#contact" class="px-6 py-3 border border-blue-600 rounded">Contact Me</a>
            </div>
        </div>
    </section>

    <!-- Additional sections would follow similar pattern -->
    
    <script src="js/main.js"></script>
</body>
</html>
