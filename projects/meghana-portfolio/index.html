<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meghana | Front-end Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors">
    <!-- Navbar -->
    <nav class="fixed w-full z-10 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm p-4 flex justify-between items-center">
        <span class="font-bold text-xl">Meghana</span>
        <div class="space-x-4">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
            <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 bg-gray-200 dark:bg-gray-700 rounded">Toggle Theme</button>
        </div>
    </nav>

    <!-- Hero -->
    <header id="home" class="h-screen flex flex-col justify-center items-center bg-[url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97')] bg-cover bg-center text-white">
        <h1 class="text-5xl font-bold">I'm Meghana</h1>
        <p class="text-2xl mt-4">Front-end Web Developer from Bengaluru</p>
        <div class="mt-8 space-x-4">
            <a href="#projects" class="bg-blue-600 px-6 py-2 rounded">See My Work</a>
            <a href="#contact" class="border border-white px-6 py-2 rounded">Contact Me</a>
        </div>
    </header>

    <!-- About -->
    <section id="about" class="p-16">
        <h2 class="text-3xl font-bold mb-6">About Me</h2>
        <p>Passionate developer creating modern web experiences.</p>
        <a href="#" class="inline-block mt-4 bg-gray-800 text-white px-4 py-2 rounded">Download Resume</a>
    </section>

    <!-- Projects -->
    <section id="projects" class="p-16 bg-gray-100 dark:bg-gray-800">
        <h2 class="text-3xl font-bold mb-8">Projects</h2>
        <div class="grid md:grid-cols-3 gap-8">
            <div class="bg-white dark:bg-gray-700 p-6 rounded shadow">
                <img src="https://via.placeholder.com/300" alt="Project" class="mb-4">
                <h3 class="font-bold">Shopping Website</h3>
            </div>
            <div class="bg-white dark:bg-gray-700 p-6 rounded shadow">
                <img src="https://via.placeholder.com/300" alt="Project" class="mb-4">
                <h3 class="font-bold">Business Dashboard</h3>
            </div>
            <div class="bg-white dark:bg-gray-700 p-6 rounded shadow">
                <img src="https://via.placeholder.com/300" alt="Project" class="mb-4">
                <h3 class="font-bold">Mobile App Page</h3>
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="p-16">
        <h2 class="text-3xl font-bold mb-8">Contact</h2>
        <form class="max-w-md" onsubmit="alert('Thank you!'); return false;">
            <input type="text" placeholder="Name" class="w-full mb-4 p-2 border dark:bg-gray-700">
            <input type="email" placeholder="Email" class="w-full mb-4 p-2 border dark:bg-gray-700">
            <textarea placeholder="Message" class="w-full mb-4 p-2 border dark:bg-gray-700"></textarea>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2">Send</button>
        </form>
    </section>
</body>
</html>
