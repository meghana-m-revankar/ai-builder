<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Bloom & Petal</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-900">
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur shadow-sm">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-serif font-bold text-emerald-800">Bloom & Petal</a>
      <div class="hidden md:flex gap-8">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="text-emerald-800 font-semibold">Contact</a>
      </div>
    </nav>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-12 grid md:grid-cols-2 gap-12">
    <div>
      <h1 class="text-4xl font-serif font-bold mb-6">Get in touch</h1>
      <p class="mb-4">Visit us at our store in Indiranagar, Bengaluru.</p>
      <p class="font-bold">Open Daily: 9 AM - 8 PM</p>
    </div>
    <form name="contact" method="POST" class="bg-white p-8 rounded-2xl shadow-sm" data-netlify="true">
      <input type="hidden" name="form-name" value="contact">
      <div class="mb-4"><label class="block mb-2">Name</label><input type="text" name="name" class="w-full p-2 border border-stone-200 rounded"></div>
      <div class="mb-4"><label class="block mb-2">Message</label><textarea name="message" class="w-full p-2 border border-stone-200 rounded"></textarea></div>
      <button type="submit" class="bg-emerald-800 text-white px-6 py-2 rounded-full">Send Message</button>
    </form>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
