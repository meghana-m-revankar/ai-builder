<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Staff Dashboard | Saffron Leaf</title>
</head>
<body class="bg-gray-900 flex">
    <aside class="w-64 bg-black h-screen p-6">
        <h1 class="text-gold font-bold text-xl mb-10">Saffron Dashboard</h1>
        <nav class="space-y-4">
            <a href="#" class="block text-gray-400 hover:text-white">Orders</a>
            <a href="#" class="block text-gray-400 hover:text-white">Reservations</a>
        </nav>
    </aside>
    <main class="flex-1 p-10">
        <div class="grid grid-cols-4 gap-6 mb-10">
            <div class="bg-gray-800 p-6 rounded text-center"><p class="text-gray-400">Total Sales</p><p class="text-2xl font-bold">₹12,400</p></div>
        </div>
        <table class="w-full text-left bg-gray-800 rounded">
            <thead><tr class="border-b border-gray-700"><th class="px-6 py-4">ID</th><th class="px-6 py-4">Customer</th><th class="px-6 py-4">Total</th><th class="px-6 py-4">Status</th></tr></thead>
            <tbody id="dashboard-table-body"></tbody>
        </table>
    </main>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
