<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Arer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="h-screen bg-gray-100 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
        <header class="p-4 bg-gray-50 border-b">
            <input type="text" placeholder="Search chats..." class="w-full p-2 rounded-lg border">
        </header>
        <div id="contact-list" class="flex-1 overflow-y-auto">
            <!-- Dynamic Contacts -->
        </div>
    </aside>
    <!-- Chat Window -->
    <main class="flex-1 flex flex-col bg-gray-50">
        <header class="p-4 bg-white border-b shadow-sm font-bold">John Doe</header>
        <div id="messages" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Messages -->
        </div>
        <footer class="p-4 bg-white border-t">
            <input type="text" class="w-full p-2 border rounded-full" placeholder="Type a message...">
        </footer>
    </main>
</body>
</html>
