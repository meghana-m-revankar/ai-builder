<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Spice Garden Cafe</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-brand-50 text-brand-900 font-body">
    <header class="sticky top-0 bg-white/90 backdrop-blur-sm z-50 border-b border-brand-100">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-display font-bold text-brand-700">Spice Garden</a>
            <div class="hidden md:flex gap-8 font-medium">
                <a href="index.html">Home</a>
                <a href="menu.html" class="nav-active">Menu</a>
                <a href="contact.html" class="hover:text-accent-500">Contact</a>
            </div>
            <a href="contact.html" class="bg-brand-700 text-white px-5 py-2.5 rounded-full hover:bg-brand-900">Book a Table</a>
        </nav>
    </header>
    <main class="py-20 max-w-7xl mx-auto px-6">
        <h1 class="text-5xl font-display font-bold text-center mb-16">Our Menu</h1>
        <div class="grid md:grid-cols-2 gap-8">
            <div class="flex justify-between items-center p-6 bg-white rounded-xl">
                <div><h3 class="font-bold text-xl">Flat White</h3><p class="text-sm text-brand-500">Velvety steamed milk over espresso.</p></div>
                <span class="font-display font-bold text-xl text-brand-700">$4.50</span>
            </div>
            <div class="flex justify-between items-center p-6 bg-white rounded-xl">
                <div><h3 class="font-bold text-xl">Cold Brew</h3><p class="text-sm text-brand-500">12-hour steeped slow roasted beans.</p></div>
                <span class="font-display font-bold text-xl text-brand-700">$5.00</span>
            </div>
            <div class="flex justify-between items-center p-6 bg-white rounded-xl">
                <div><h3 class="font-bold text-xl">Almond Croissant</h3><p class="text-sm text-brand-500">Flaky pastry with almond cream.</p></div>
                <span class="font-display font-bold text-xl text-brand-700">$6.25</span>
            </div>
            <div class="flex justify-between items-center p-6 bg-white rounded-xl">
                <div><h3 class="font-bold text-xl">Berry Tart</h3><p class="text-sm text-brand-500">Seasonal berries on butter crust.</p></div>
                <span class="font-display font-bold text-xl text-brand-700">$7.50</span>
            </div>
        </div>
    </main>
    <script src="js/main.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
