<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Brew & Bean Cafe</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-brand-50">
  <nav class="sticky top-0 z-50 bg-brand-50/90 backdrop-blur-md border-b border-brand-100">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between py-4">
      <a href="index.html" class="text-2xl font-display font-bold">Brew & Bean</a>
      <div class="hidden md:flex gap-8 font-semibold">
        <a href="index.html" class="hover:text-accent-500">Home</a>
        <a href="menu.html" class="hover:text-accent-500">Menu</a>
        <a href="about.html" class="hover:text-accent-500">About</a>
        <a href="contact.html" class="text-accent-500">Contact</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-16">
    <h1 class="text-4xl font-display font-bold mb-8">Get In Touch</h1>
    <div class="grid md:grid-cols-2 gap-12">
      <form name="contact" method="POST" data-netlify="true" class="space-y-4">
        <input type="hidden" name="form-name" value="contact">
        <input type="text" name="name" placeholder="Your Name" class="w-full p-3 rounded-xl border border-brand-300">
        <input type="email" name="email" placeholder="Your Email" class="w-full p-3 rounded-xl border border-brand-300">
        <textarea name="message" placeholder="Your Message" class="w-full p-3 rounded-xl border border-brand-300 h-32"></textarea>
        <button class="bg-accent-500 text-white px-8 py-3 rounded-full font-bold">Send Message</button>
      </form>
      <div>
        <h3 class="font-bold mb-4">Location</h3>
        <p class="text-brand-700">123 Cafe St, Coffee Town</p>
        <h3 class="font-bold mt-6 mb-4">Opening Hours</h3>
        <p class="text-brand-700">Mon-Fri: 7am - 8pm<br>Sat-Sun: 8am - 6pm</p>
      </div>
    </div>
  </main>
  
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
