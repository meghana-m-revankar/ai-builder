<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Brew & Bean Cafe</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-brand-50 flex h-screen">
  <aside class="w-64 bg-brand-900 text-white p-6 hidden md:block">
    <h2 class="text-xl font-bold mb-8">Admin Portal</h2>
    <nav class="space-y-4">
      <a href="#" class="flex items-center gap-3"><i data-lucide="bar-chart-2"></i> Dashboard</a>
      <a href="#" class="flex items-center gap-3"><i data-lucide="coffee"></i> Inventory</a>
      <a href="#" class="flex items-center gap-3"><i data-lucide="users"></i> Staff</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <div class="grid md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <p class="text-brand-500 text-sm">Total Revenue</p>
        <h3 class="text-2xl font-bold">$12,450</h3>
        <span class="text-green-600 text-xs font-semibold">+5.4%</span>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <p class="text-brand-500 text-sm">Active Orders</p>
        <h3 class="text-2xl font-bold">48</h3>
        <span class="text-green-600 text-xs font-semibold">+12%</span>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <p class="text-brand-500 text-sm">Staff Online</p>
        <h3 class="text-2xl font-bold">6</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <p class="text-brand-500 text-sm">Conversion</p>
        <h3 class="text-2xl font-bold">3.2%</h3>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
      <h3 class="font-bold mb-6">Recent Activity</h3>
      <table class="w-full text-left">
        <thead>
          <tr class="border-b border-brand-100">
            <th class="p-4 text-sm font-semibold">Order ID</th>
            <th class="p-4 text-sm font-semibold">Customer</th>
            <th class="p-4 text-sm font-semibold">Total</th>
            <th class="p-4 text-sm font-semibold">Status</th>
          </tr>
        </thead>
        <tbody id="order-table-body"></tbody>
      </table>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
