<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Menu | Brew & Bean Cafe</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-brand-50">
  <nav class="sticky top-0 z-50 bg-brand-50/90 backdrop-blur-md border-b border-brand-100">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between py-4">
      <a href="index.html" class="text-2xl font-display font-bold">Brew & Bean</a>
      <div class="hidden md:flex gap-8 font-semibold">
        <a href="index.html" class="hover:text-accent-500">Home</a>
        <a href="menu.html" class="text-accent-500">Menu</a>
        <a href="about.html" class="hover:text-accent-500">About</a>
        <a href="contact.html" class="hover:text-accent-500">Contact</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-16">
    <h1 class="text-4xl font-display font-bold mb-12">The Menu</h1>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <img loading="lazy" decoding="async" src="https://loremflickr.com/400/300/latte%2Cart%2Ccoffee" alt="Latte" class="rounded-xl mb-4">
        <h3 class="font-bold text-lg">Signature Latte</h3>
        <p class="text-sm text-brand-700">Rich espresso with steamed milk and velvety foam.</p>
        <span class="block mt-4 font-bold">$4.50</span>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <img loading="lazy" decoding="async" src="https://loremflickr.com/400/300/fresh%2Cbaked%2Ccroissant" alt="Croissant" class="rounded-xl mb-4">
        <h3 class="font-bold text-lg">Butter Croissant</h3>
        <p class="text-sm text-brand-700">Flaky, buttery pastry, baked fresh every morning.</p>
        <span class="block mt-4 font-bold">$3.00</span>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-100">
        <img loading="lazy" decoding="async" src="https://loremflickr.com/400/300/dark%2Croast%2Cdrip%2Ccoffee" alt="Black Coffee" class="rounded-xl mb-4">
        <h3 class="font-bold text-lg">House Blend Drip</h3>
        <p class="text-sm text-brand-700">Single-origin beans for a balanced, full-bodied cup.</p>
        <span class="block mt-4 font-bold">$3.50</span>
      </div>
    </div>
  </main>
  
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
