<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Tracker | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <aside class="sidebar d-none d-lg-block">
      <a class="brand" href="index.html"><i class="bi bi-truck"></i> Fleet Tracker</a>
      <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="index.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-link" href="vans.html"><i class="bi bi-truck"></i> Vans</a>
        <a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i> Maintenance</a>
      </nav>
    </aside>
    <main class="flex-grow-1">
      <header class="navbar navbar-expand-lg bg-white border-bottom px-4">
        <div class="container-fluid">
          <span class="navbar-brand d-lg-none">Fleet Tracker</span>
          <div class="ms-auto"><span class="badge bg-light text-dark">Fleet Manager</span></div>
        </div>
      </header>
      <section class="p-4">
        <h1>Dashboard</h1>
        <div class="row g-4 mt-2" id="kpi-grid"></div>
        <div class="card mt-4 p-4">
          <h3>Deliveries Overview</h3>
          <div id="chart" class="mt-3" style="height: 200px; background: var(--canvas); border-radius: var(--radius);"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
