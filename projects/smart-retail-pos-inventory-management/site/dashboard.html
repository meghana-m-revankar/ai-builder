<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Smart Retail</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="flex bg-canvas h-screen">
  <aside class="w-64 bg-brand-900 text-white p-6">
    <div class="text-2xl font-bold mb-10"><i class="bx bx-store-alt"></i> SmartRetail</div>
    <nav class="space-y-4">
      <a href="dashboard.html" class="flex items-center gap-3 bg-brand-700 p-3 rounded-lg"><i class="bx bxs-dashboard"></i> Dashboard</a>
      <a href="index.html" class="flex items-center gap-3 p-3 text-white/70 hover:bg-white/10 rounded-lg"><i class="bx bx-home"></i> Back to Public</a>
    </nav>
  </aside>
  
  <main class="flex-1 overflow-y-auto p-8">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold">Admin Dashboard</h1>
      <div class="bg-white p-2 rounded-lg border border-line w-64"><i class="bx bx-search"></i> Search...</div>
    </header>

    <section class="grid grid-cols-4 gap-6 mb-8" id="stats-grid">
      <!-- KPIs injected via JS -->
    </section>

    <section class="bg-white p-6 rounded-xl border border-line">
      <h2 class="text-xl font-bold mb-6">Inventory Status</h2>
      <table class="w-full text-left">
        <thead><tr class="border-b border-line text-ink-600">
          <th class="p-4">Name</th><th class="p-4">SKU</th><th class="p-4">Stock</th><th class="p-4">Price</th><th class="p-4">Status</th>
        </tr></thead>
        <tbody id="inventory-table"></tbody>
      </table>
    </section>
  </main>
  
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const grid = document.getElementById('stats-grid');
    stats.forEach(s => {
      grid.innerHTML += `<div class="bg-white p-6 rounded-xl border border-line">
        <div class="text-brand-700 text-2xl mb-2"><i class="bx ${s.icon}"></i></div>
        <div class="text-ink-600 text-sm">${s.label}</div>
        <div class="text-2xl font-bold">${s.value}</div>
      </div>`;
    });
  </script>
</body>
</html>
