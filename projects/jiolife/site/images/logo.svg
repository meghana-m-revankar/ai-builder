<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" height="56">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-text {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: #0f172a;
      }
      .brand-highlight {
        fill: #ea580c;
      }
    </style>
  </defs>

  <!-- Icon: Modern Shopping Bag & Infinity/Flow (representing Jio + Life) -->
  <g transform="translate(4, 4)">
    <!-- Outer Bag Shape -->
    <path d="M10 16h28v24a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3V16z" fill="#ea580c" opacity="0.15"/>
    <path d="M12 18h24v22a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V18z" fill="#ea580c"/>
    
    <!-- Bag Handle -->
    <path d="M16 18V12a8 8 0 0 1 16 0v6" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Dynamic check/smile accent inside bag -->
    <path d="M18 29l4 4 8-8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Business Name -->
  <text x="62" y="37" class="brand-text">Jio<tspan class="brand-highlight">Life</tspan></text>
</svg>