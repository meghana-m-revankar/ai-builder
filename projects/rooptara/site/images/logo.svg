<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" height="56">
  <defs>
    <style>
      .brand-name { font-family: "Plus Jakarta Sans", Arial, sans-serif; font-weight: 800; font-size: 24px; fill: #0f172a; }
    </style>
  </defs>
  
  <!-- Icon: Modern stylized food bowl / cloche & star (Rooptara meaning star/moon light) -->
  <g transform="translate(4, 4)">
