    <!-- Dome / Cloche -->
    <path d="M12 24c0-6.627 5.373-12 12-12s12 5.373 12 12H12z" fill="#c2410c"/>
    <!-- Star accent -->
    <path d="M24 8l1.5 3h3l-2.5 1.8 1 3.2-3-2-3 2 1-3.2L19.5 11h3L24 8z" fill="#ffffff" transform="scale(0.6) translate(16, 2)"/>
    <!-- Base plate -->
    <path d="M9 28h30a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1z" fill="#c2410c"/>
  </g>

  <!-- Business Name -->
  <text x="64" y="35" class="brand-name">Rooptara</text>
</svg>