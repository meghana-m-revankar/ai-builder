<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | QuickBill POS</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex h-screen">
  <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col">
    <h2 class="text-xl font-bold mb-10 text-emerald-500 flex items-center gap-2"><i class="bx bx-receipt"></i> QuickBill</h2>
    <nav class="space-y-4 flex-grow">
      <a href="dashboard.html" class="block p-3 rounded bg-emerald-600"><i class="bx bx-home-alt"></i> Dashboard</a>
      <a href="pos.html" class="block p-3 rounded hover:bg-slate-800"><i class="bx bx-desktop"></i> POS Screen</a>
      <a href="products.html" class="block p-3 rounded hover:bg-slate-800"><i class="bx bx-list-ul"></i> Inventory</a>
    </nav>
  </aside>
  <main class="flex-grow p-8 overflow-y-auto">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold">Dashboard</h1>
      <button class="bg-white border px-4 py-2 rounded-lg font-medium shadow-sm">Export CSV</button>
    </header>
    <div class="grid grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <p class="text-slate-500 text-sm">Today's Sales</p>
        <h3 class="text-2xl font-bold mt-1">₹12,500</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <p class="text-slate-500 text-sm">Bills Count</p>
        <h3 class="text-2xl font-bold mt-1">45</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <p class="text-slate-500 text-sm">Avg Bill Value</p>
        <h3 class="text-2xl font-bold mt-1">₹277</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <p class="text-slate-500 text-sm">Top Item</p>
        <h3 class="text-2xl font-bold mt-1">Cappuccino</h3>
      </div>
    </div>
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
      <h3 class="font-bold mb-4">Recent Transactions</h3>
      <table class="w-full text-left">
        <thead><tr class="text-slate-400 border-b"><th class="p-4">Bill ID</th><th class="p-4">Time</th><th class="p-4">Items</th><th class="p-4">Total</th><th class="p-4">Status</th></tr></thead>
        <tbody id="recent-bills-table"></tbody>
      </table>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
