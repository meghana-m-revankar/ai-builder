<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Chai Corner Café</title>
  <meta name="description" content="Explore our menu of authentic masala chai, filter coffee, and homemade snacks.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-canvas font-body text-ink-900">
  <header class="sticky top-0 z-40 border-b border-line bg-canvas/80 backdrop-blur-md">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="flex items-center gap-2.5 font-display text-lg font-extrabold text-brand-900">
        <img src="assets/logo.svg" alt="Chai Corner logo" width="36" height="36"><span>Chai Corner</span>
      </a>
      <ul class="hidden items-center gap-1 lg:flex">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="menu.html" aria-current="page" class="nav-link nav-link--active">Menu</a></li>
        <li><a href="about.html" class="nav-link">Our story</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-20 sm:px-6">
    <h1 class="section-title">Our Menu</h1>
    <div class="mt-10 flex flex-wrap gap-4">
      <div class="flex items-center gap-2"><i data-lucide="coffee"></i><span>Authentic Chai</span></div>
      <div class="flex items-center gap-2"><i data-lucide="cup-soda"></i><span>Filter Coffee</span></div>
      <div class="flex items-center gap-2"><i data-lucide="sandwich"></i><span>Snacks</span></div>
      <div class="flex items-center gap-2"><i data-lucide="cookie"></i><span>Cookies</span></div>
      <div class="flex items-center gap-2"><i data-lucide="cake"></i><span>Cakes</span></div>
      <div class="flex items-center gap-2"><i data-lucide="leaf"></i><span>Herbal Tea</span></div>
      <div class="flex items-center gap-2"><i data-lucide="milk"></i><span>Milkshakes</span></div>
      <div class="flex items-center gap-2"><i data-lucide="ice-cream"></i><span>Ice Cream</span></div>
      <div class="flex items-center gap-2"><i data-lucide="utensils"></i><span>Breakfast</span></div>
      <div class="flex items-center gap-2"><i data-lucide="shopping-bag"></i><span>Takeaway</span></div>
      <div class="flex items-center gap-2"><i data-lucide="wifi"></i><span>Free Wi-Fi</span></div>
      <div class="flex items-center gap-2"><i data-lucide="music"></i><span>Music</span></div>
      <div class="flex items-center gap-2"><i data-lucide="book"></i><span>Books</span></div>
      <div class="flex items-center gap-2"><i data-lucide="users"></i><span>Community</span></div>
      <div class="flex items-center gap-2"><i data-lucide="heart"></i><span>Love</span></div>
    </div>
    <div id="product-filter" class="mt-6 flex flex-wrap gap-2"></div>
    <div id="product-grid" class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
