<!doctype html>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-canvas font-body text-ink-900">
  <header class="sticky top-0 z-40 border-b border-line bg-canvas/80 backdrop-blur-md">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="flex items-center gap-2.5 font-display text-lg font-extrabold text-brand-900">

      </a>
      <ul class="hidden items-center gap-1 lg:flex">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="menu.html" class="nav-link">Menu</a></li>
        <li><a href="about.html" class="nav-link">Our story</a></li>

    </nav>

  <main class="mx-auto max-w-3xl px-4 py-20 sm:px-6">
    <h1 class="section-title">Contact Us</h1>
    <p class="mt-6 text-lg text-ink-600">Visit us at 14, 5th Block, 80 Feet Road, Koramangala, Bangalore 560095. Call us at +91 98450 12345.</p>
    <div class="mt-10 grid grid-cols-3 gap-4">
      <i data-lucide="map-pin"></i><i data-lucide="phone"></i><i data-lucide="mail"></i>
      <i data-lucide="clock"></i><i data-lucide="calendar"></i><i data-lucide="instagram"></i>
      <i data-lucide="facebook"></i><i data-lucide="twitter"></i><i data-lucide="linkedin"></i>
      <i data-lucide="message-circle"></i><i data-lucide="send"></i><i data-lucide="map"></i>
