<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order/Contact | Golden Crust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Golden Crust</a>
            <div class="collapse navbar-collapse"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li></ul></div>
        </div>
    </nav>
    <div class="container py-5">
        <h2>Pre-order your treats</h2>
        <form id="orderForm" class="mt-4">
            <div class="mb-3"><input type="text" class="form-control" placeholder="Name" required></div>
            <div class="mb-3"><input type="tel" class="form-control" placeholder="Phone" required></div>
            <div class="mb-3"><select class="form-select"><option>Sourdough</option><option>Croissant</option></select></div>
            <div class="mb-3"><input type="number" class="form-control" placeholder="Quantity"></div>
            <div class="mb-3"><input type="date" class="form-control"></div>
            <button type="submit" class="btn btn-primary">Submit Order</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
