<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pre-Order | Golden Crust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <form id="orderForm" class="p-4 border rounded bg-white">
            <div class="mb-3"><label>Name</label><input type="text" class="form-control" required></div>
            <div class="mb-3"><label>Phone</label><input type="tel" class="form-control" required></div>
            <div class="mb-3"><label>Product</label><select class="form-select"><option>Sourdough</option></select></div>
            <div class="mb-3"><label>Quantity</label><input type="number" class="form-control"></div>
            <button type="submit" class="btn btn-primary">Submit Pre-order</button>
        </form>
    </div>
</body>
</html>
