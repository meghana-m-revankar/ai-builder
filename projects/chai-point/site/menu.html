<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Chai Point</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-canvas font-body">
  <nav class="flex items-center justify-between px-6 py-4 bg-white border-b border-line">
    <a href="index.html" class="text-2xl font-display font-extrabold text-brand-900">Chai Point</a>
    <div class="hidden md:flex gap-6 font-medium">
      <a href="index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link text-accent-500">Menu</a>
      <a href="contact.html" class="nav-link">Visit Us</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto py-20 px-6">
    <h1 class="text-4xl font-display font-extrabold text-center mb-12">Our Menu</h1>
    <div class="space-y-12">
      <div>
        <h2 class="text-2xl font-bold mb-6 text-brand-700">Hot Chai</h2>
        <div class="grid gap-4">
          <div class="flex justify-between p-4 border rounded-xl bg-white"><span>Masala Chai</span><span class="font-bold text-accent-500">₹40</span></div>
          <div class="flex justify-between p-4 border rounded-xl bg-white"><span>Ginger Tea</span><span class="font-bold text-accent-500">₹50</span></div>
        </div>
      </div>
      <div>
        <h2 class="text-2xl font-bold mb-6 text-brand-700">Snacks</h2>
        <div class="grid gap-4">
          <div class="flex justify-between p-4 border rounded-xl bg-white"><span>Samosa</span><span class="font-bold text-accent-500">₹80</span></div>
          <div class="flex justify-between p-4 border rounded-xl bg-white"><span>Bun Maska</span><span class="font-bold text-accent-500">₹60</span></div>
        </div>
      </div>
    </div>
  </main>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
