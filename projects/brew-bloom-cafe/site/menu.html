<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Brew & Bloom</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-brand-50">
  <nav class="flex items-center justify-between p-6 max-w-7xl mx-auto">
    <a href="index.html" class="text-2xl font-bold font-display text-brand-900">Brew & Bloom</a>
    <div class="hidden md:flex gap-8 font-medium">
      <a href="index.html" class="hover:text-brand-500">Home</a>
      <a href="menu.html" class="hover:text-brand-500">Menu</a>
      <a href="contact.html" class="hover:text-brand-500">Contact</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-20 px-6">
    <h1 class="text-5xl font-bold font-display text-brand-900">Our Menu</h1>
    <div class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <img loading="lazy" decoding="async" src="https://loremflickr.com/400/300/cappuccino%2Cbrew" alt="Cappuccino" class="rounded-xl w-full h-48 object-cover">
        <h3 class="mt-4 font-bold">Classic Cappuccino</h3>
        <p class="text-sm mt-1">Rich espresso with frothy milk.</p>
        <p class="mt-4 font-bold text-brand-700">₹250</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <img loading="lazy" decoding="async" src="https://loremflickr.com/400/300/cold%2Cbrew" alt="Cold Brew" class="rounded-xl w-full h-48 object-cover">
        <h3 class="mt-4 font-bold">Iced Cold Brew</h3>
        <p class="text-sm mt-1">Slow-steeped perfection.</p>
        <p class="mt-4 font-bold text-brand-700">₹300</p>
      </div>
    </div>
  </main>

  <footer class="bg-brand-900 text-white py-12 px-6 mt-20">
    <p class="text-center text-xs">&copy; <span id="footer-year"></span> Brew & Bloom Cafe. All rights reserved.</p>
  </footer>
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
