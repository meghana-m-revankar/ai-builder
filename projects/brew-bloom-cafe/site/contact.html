<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Brew & Bloom</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-brand-50">
  <nav class="flex items-center justify-between p-6 max-w-7xl mx-auto">
    <a href="index.html" class="text-2xl font-bold font-display text-brand-900">Brew & Bloom</a>
    <div class="hidden md:flex gap-8 font-medium">
      <a href="index.html" class="hover:text-brand-500">Home</a>
      <a href="menu.html" class="hover:text-brand-500">Menu</a>
      <a href="contact.html" class="hover:text-brand-500">Contact</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto py-20 px-6">
    <h1 class="text-5xl font-bold font-display text-brand-900">Book a Table</h1>
    <form name="contact" method="POST" data-netlify="true" class="mt-10 bg-white p-8 rounded-2xl shadow-sm">
      <input type="hidden" name="form-name" value="contact">
      <div class="space-y-4">
        <input type="text" name="name" placeholder="Name" class="w-full p-4 rounded-xl border border-brand-100" required>
        <input type="tel" name="phone" placeholder="Phone" class="w-full p-4 rounded-xl border border-brand-100" required>
        <button type="submit" class="w-full bg-brand-500 text-white font-bold p-4 rounded-xl hover:bg-brand-700">Submit Booking</button>
      </div>
    </form>
  </main>
  
  <footer class="bg-brand-900 text-white py-12 px-6">
    <p class="text-center text-xs">&copy; <span id="footer-year"></span> Brew & Bloom Cafe. All rights reserved.</p>
  </footer>
  <script src="js/main.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/site-kit.js"></script>
</body>
</html>
