<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" height="56">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-text {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-weight: 800;
        font-size: 22px;
        fill: #0f172a;
        letter-spacing: -0.5px;
      }
      .brand-accent {
        fill: #4f46e5;
      }
    </style>
  </defs>
  
  <!-- Icon: Modern upward-trending bar chart forming an abstract growth arrow -->
  <g transform="translate(6, 6)">
    <!-- Background rounded tile -->
    <rect width="44" height="44" rx="10" fill="#ede9fe" />
    
    <!-- Growth bars / ascending steps -->
    <rect x="10" y="26" width="5" height="10" rx="1.5" class="brand-accent" />
    <rect x="19.5" y="20" width="5" height="16" rx="1.5" class="brand-accent" />
    <rect x="29" y="12" width="5" height="24" rx="1.5" class="brand-accent" />

    <!-- Upward arrow overlaying the steps -->
    <path d="M7 23 L21.5 10 L27 15.5 L36 7" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 7 H36 V13" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Business Name -->
  <text x="62" y="35" class="brand-text">Skill<tspan class="brand-accent">Up</tspan></text>
</svg>